<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243414"/>
      <stop offset="50%" stop-color="#18230d"/>
      <stop offset="100%" stop-color="#0f1608"/>
    </linearGradient>

    <!-- Neon Olive Accent Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ed68"/>
      <stop offset="100%" stop-color="#8fa82b"/>
    </linearGradient>

    <!-- Edge Connection Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8c242" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a8c242" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#logoBg)" stroke="#3e5517" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Rim -->
  <rect x="11" y="11" width="138" height="138" rx="33" fill="none" stroke="#a8c242" stroke-width="1.2" stroke-opacity="0.2"/>

  <!-- GRAPH NODES & DIRECTED EDGES -->

  <!-- Outer Graph Edge Ring (Subtle Orbit) -->
  <circle cx="80" cy="80" r="46" fill="none" stroke="#2d4016" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Graph Connector Lines (DAG Flow) -->
  <!-- Top Node to Center -->
  <line x1="80" y1="36" x2="80" y2="70" stroke="url(#edgeGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Node to Center -->
  <line x1="42" y1="92" x2="70" y2="82" stroke="url(#edgeGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Node to Center -->
  <line x1="118" y1="92" x2="90" y2="82" stroke="url(#edgeGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center to Bottom Sink Node -->
  <line x1="80" y1="90" x2="80" y2="124" stroke="url(#edgeGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left to Right Cross Edge -->
  <path d="M 46 96 Q 80 114 114 96" fill="none" stroke="#3e5517" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- CODE BRACKET OVERLAYS (Left & Right) -->
  <!-- Left Bracket < -->
  <path d="M 52 68 L 38 80 L 52 92" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#softGlow)"/>
  <!-- Right Bracket > -->
  <path d="M 108 68 L 122 80 L 108 92" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#softGlow)"/>

  <!-- PERIPHERAL AGENT NODES -->
  <!-- Node 1: Top (Planner Node) -->
  <circle cx="80" cy="36" r="8" fill="#141d0b" stroke="#a8c242" stroke-width="2.5"/>
  <circle cx="80" cy="36" r="3.5" fill="#a8c242"/>

  <!-- Node 2: Bottom (Report Node) -->
  <circle cx="80" cy="124" r="8" fill="#141d0b" stroke="#a8c242" stroke-width="2.5"/>
  <circle cx="80" cy="124" r="3.5" fill="#a8c242"/>

  <!-- Node 3: Left (Security Auditor Node) -->
  <circle cx="42" cy="92" r="7" fill="#141d0b" stroke="#f43f5e" stroke-width="2"/>
  <circle cx="42" cy="92" r="3" fill="#f43f5e"/>

  <!-- Node 4: Right (Quality & Critic Node) -->
  <circle cx="118" cy="92" r="7" fill="#141d0b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="118" cy="92" r="3" fill="#38bdf8"/>

  <!-- CENTRAL CORE: Reflection & Audit Sentinel Diamond -->
  <g transform="translate(80, 80)">
    <!-- Outer Pulsing Glow Diamond -->
    <rect x="-16" y="-16" width="32" height="32" rx="6" transform="rotate(45)" fill="url(#neonGlow)" filter="url(#softGlow)"/>
    <!-- Inner Core Diamond -->
    <rect x="-11" y="-11" width="22" height="22" rx="4" transform="rotate(45)" fill="#111809"/>
    <!-- Central Code Audit Checkmark Symbol -->
    <path d="M -5 0 L -1 4 L 6 -3" fill="none" stroke="#d4ed68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
