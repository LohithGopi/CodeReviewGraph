[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codereviewgraph"
version = "0.1.0"
description = "Stateful Multi-Agent Code Auditor & Refactoring Workflow using LangGraph & LangChain"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AutoDev Factory", email = "autodev@local.dev" }
]
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.8.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
gemini = [
    "langchain-google-genai>=4.0.0",
]

[project.scripts]
codereviewgraph = "codereviewgraph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.vercel]
entrypoint = "codereviewgraph.api:app"

